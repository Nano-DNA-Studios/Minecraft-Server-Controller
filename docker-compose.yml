services:
  app:
    #user: "0:0"
    build: .
    container_name: minecraft-server-controller
    env_file:
        - .env
    environment:
      - DOCKER_HOST=tcp://host.docker.internal:2375
    ports:
      - ${ControllerPort}:80
    volumes:
      - type: volume
        source: mc-data
        target: /data
        volume:
          nocopy: true
      - ./backup:/backup

  server:
    image: nano-minecraft-server:26.2
    container_name: nano-minecraft-server
    env_file:
        - .env
    environment:
      - MEMORY_MIN=2G
      - MEMORY_MAX=12G
    ports:
      - ${ServerPort}:25565
      - ${MapPort}:8123
    volumes:
      - mc-data:/data
volumes:
  mc-data: